<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.22), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.20), transparent 30%),
                #080b16;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-shell {
            width: min(980px, 100%);
            height: min(760px, 94vh);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(24px);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        }

        .logo {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            font-size: 24px;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.28);
        }

        .header h1 {
            font-size: 20px;
        }

        .status {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 13px;
        }

        .status::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
            animation: appear 0.2s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(76%, 700px);
            padding: 14px 17px;
            border-radius: 20px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
        }

        .bot .bubble {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(30, 41, 59, 0.86);
            border-bottom-left-radius: 6px;
        }

        .user .bubble {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-bottom-right-radius: 6px;
        }

        .welcome {
            max-width: 650px;
            margin: 40px auto;
            text-align: center;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .welcome h2 {
            font-size: clamp(24px, 5vw, 34px);
            margin-bottom: 10px;
        }

        .welcome p {
            color: #94a3b8;
            line-height: 1.6;
        }

        .composer {
            padding: 18px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.09);
        }

        .input-row {
            display: flex;
            gap: 10px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            background: rgba(2, 6, 23, 0.55);
        }

        textarea {
            flex: 1;
            min-height: 46px;
            max-height: 130px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: #f8fafc;
            padding: 12px 10px;
            font: inherit;
        }

        textarea::placeholder {
            color: #64748b;
        }

        button {
            width: 48px;
            height: 48px;
            border: 0;
            border-radius: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            font-size: 19px;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            text-align: center;
            color: #64748b;
            font-size: 11px;
            margin-top: 9px;
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #94a3b8;
            animation: bounce 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-shell {
                height: 100vh;
                border-radius: 0;
            }

            .messages {
                padding: 20px 15px;
            }

            .bubble {
                max-width: 88%;
            }

            .header {
                padding: 16px;
            }

            .composer {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <main class="chat-shell">
        <header class="header">
            <div class="logo">🎓</div>
            <div>
                <h1>StudyMate AI</h1>
                <div class="status">Study assistant online</div>
            </div>
        </header>

        <section class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">📚</div>
                <h2>Learn smarter with StudyMate</h2>
                <p>
                    Ask me study-related questions, concepts, definitions,
                    examples, revision topics, or exam-preparation questions.
                </p>
            </div>
        </section>

        <footer class="composer">
            <div class="input-row">
                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Ask a study question..."
                    aria-label="Study question"
                ></textarea>
                <button id="sendButton" aria-label="Send message">➤</button>
            </div>
            <div class="hint">Study questions only • Powered by Gemini</div>
        </footer>
    </main>

    <script>
        const messages = document.getElementById("messages");
        const input = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const welcome = document.getElementById("welcome");

        function addMessage(text, type) {
            if (welcome) {
                welcome.remove();
            }

            const wrapper = document.createElement("div");
            wrapper.className = `message ${type}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        function addTyping() {
            const wrapper = document.createElement("div");
            wrapper.className = "message bot";
            wrapper.id = "typing";

            const bubble = document.createElement("div");
            bubble.className = "bubble typing";
            bubble.innerHTML = "<span></span><span></span><span></span>";

            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTyping() {
            document.getElementById("typing")?.remove();
        }

        async function sendMessage() {
            const message = input.value.trim();

            if (!message || sendButton.disabled) {
                return;
            }

            addMessage(message, "user");
            input.value = "";
            input.style.height = "auto";
            sendButton.disabled = true;
            addTyping();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                removeTyping();
                addMessage(
                    data.response || "Sorry, I could not process that question.",
                    "bot"
                );
            } catch (error) {
                removeTyping();
                addMessage(
                    "Unable to connect to the chatbot right now. Please try again.",
                    "bot"
                );
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        }

        sendButton.addEventListener("click", sendMessage);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
        });
    </script>
</body>
</html>
